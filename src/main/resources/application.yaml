server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: dts-learning-intelligence

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dts_learning_intelligence} # Đổi thành tên DB chứa 6 bảng của bạn
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:khoi0000}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dts-learning-intelligence-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

dts:
  practice:
    mock-enabled: true
    base-url: http://localhost:8082 # URL nội bộ của service dts-practice
  kafka:
    enabled: false # Để false khi dev local không bật Kafka; bật true khi ghép hệ thống thật
    topics:
      learning-progress: dts.practice.learning-progress.v1
