server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: dts-learning-intelligence

  datasource:
    url: jdbc:postgresql://${DB_HOST:103.20.96.85}:${DB_PORT:5434}/${DB_NAME:dts_learning_intelligence}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:K59Ptl*100504}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dts-learning-intelligence-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

dts:
  practice:
    mock-enabled: true
    base-url: http://localhost:8082 # URL nội bộ của service dts-practice
  kafka:
    enabled: false # Để false khi dev local không bật Kafka; bật true khi ghép hệ thống thật
    topics:
      learning-progress: dts.practice.learning-progress.v1
  rag:
    enabled: ${RAG_ENABLED:true}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    token-limits:
      max-query-characters: ${RAG_MAX_QUERY_CHARS:500}
      max-output-tokens: ${RAG_MAX_OUTPUT_TOKENS:600}
      rate-limit-per-minute: ${RAG_RATE_LIMIT_PER_MINUTE:5}
      daily-max-queries: ${RAG_DAILY_MAX_QUERIES:30}
      daily-max-tokens: ${RAG_DAILY_MAX_TOKENS:40000}
